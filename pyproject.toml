[project]
name = "opencode-go-proxy"
version = "0.3.1"
description = "Use your OpenCode Go subscription in Codex — local Responses-to-Chat-Completions bridge"
readme = "README.md"
authors = [{ name = "Kartik Kabadi", email = "1kartikkabadi1@gmail.com" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["zstandard>=0.22"]
keywords = ["codex", "opencode", "responses-api", "chat-completions", "agent", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/kartikkabadi/opencode-go-proxy"
Repository = "https://github.com/kartikkabadi/opencode-go-proxy"
Issues = "https://github.com/kartikkabadi/opencode-go-proxy/issues"

[project.scripts]
opencode-go-proxy = "opencode_go_proxy.app:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
