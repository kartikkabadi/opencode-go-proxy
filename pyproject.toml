[project]
name = "deepseek-responses-proxy"
version = "0.1.0"
description = "Local Responses API shim for Codex custom providers backed by Chat Completions upstreams"
readme = "README.md"
authors = [{ name = "Kartik Kabadi", email = "1kartikkabadi1@gmail.com" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["codex", "responses-api", "chat-completions", "deepseek", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/kartikkabadi/opencode-go-proxy"
Repository = "https://github.com/kartikkabadi/opencode-go-proxy"
Issues = "https://github.com/kartikkabadi/opencode-go-proxy/issues"

[project.scripts]
deepseek-responses-proxy = "deepseek_responses_proxy.app:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
