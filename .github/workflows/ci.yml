name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync
        run: uv sync --locked

      - name: Unit tests
        run: uv run python -m pytest tests -v

      - name: Ruff
        run: uvx ruff check

      - name: Build package
        run: uv build
